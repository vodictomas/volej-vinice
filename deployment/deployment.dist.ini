; Volejbálek – konfigurace nasazení (dg/ftp-deployment)
;
; Použití
;	Doplnit do řádku remote přístup k ftp
;	(parametr -t spouští testovací mód):
;	php vendor/bin/deployment deployment/deployment.dist.ini -t

[production]

remote = ftps://UZIVATEL:HESLO@ftp.example.cz/www
passiveMode = yes

; cesta k projektu, relativně k tomuto ini souboru
local = ..

test = no

; Na serveru běží i jiné soubory (staré .htm stránky, data), které v repozitáři nejsou.
; allowDelete = yes by je při prvním nasazení smazalo. Zapni až po ověření obsahu serveru.
allowDelete = no

ignore = "
	/.git
	/.gitignore
	/.idea
	/nbproject
	/node_modules
	/old
	/deployment
	/db
	/LICENSE
	/composer.json
	/composer.lock
	/package.json
	/package-lock.json
	/webpack.config.js
	/tsconfig.json
	/phpstan.neon
	/app/config/local.neon
	/app/Bootstrap.php
	/log/*
	!/log/.htaccess
	/temp/cache/*
	/temp/sessions/*
	/vendor/bin
	/vendor/dg/ftp-deployment
	/vendor/phpseclib
	/vendor/paragonie
"

before[] = local: npm run build
before[] = local: composer install --no-dev --no-interaction --optimize-autoloader

; Po nahrání smazat cache DI kontejneru a Latte, aby se regenerovala
purge[] = temp/cache

after[] = local: composer install --no-interaction

deploymentFile = .htdeployment
filePermissions = 0644
dirPermissions = 0755
